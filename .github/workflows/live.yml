name: Live contract tests
# Real calls to each provider, nightly, so a wire-format change fails here
# first. Providers without secrets are skipped.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install maturin pytest pytest-asyncio httpx
      - run: maturin build --out dist && pip install dist/*.whl && pytest -m live -rs
        working-directory: bindings/python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLEF_API_KEY: ${{ secrets.CLEF_API_KEY }}
          CLEF_ACCESS_TOKEN: ${{ secrets.CLEF_ACCESS_TOKEN }}
          CLEF_ACCOUNT_ID: ${{ secrets.CLEF_ACCOUNT_ID }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
