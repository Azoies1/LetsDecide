name: Release

# Push a tag like v0.3.0 to release. Every package is built and checked first;
# publishing only starts once all of them succeed, so a failed build can't leave
# a half-published release (registry uploads can't be undone).
#
# Publishing is opt-in per registry. Without credentials a tag only verifies:
#   crates.io  repository secret    CARGO_REGISTRY_TOKEN
#   npm        repository secret    NPM_TOKEN (an automation token)
#   PyPI       repository variable  PUBLISH_PYPI=true, plus a trusted publisher
#              on pypi.org for this repo, workflow release.yml, environment pypi
#              (no secret needed)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches every manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bad=0
          for f in Cargo.toml bindings/wasm/Cargo.toml bindings/python/Cargo.toml bindings/python/pyproject.toml; do
            v=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            [ "$v" = "$tag" ] || { echo "::error::$f is $v, tag is $tag"; bad=1; }
          done
          v=$(node -p "require('./bindings/js/package.json').version")
          [ "$v" = "$tag" ] || { echo "::error::bindings/js/package.json is $v, tag is $tag"; bad=1; }
          exit $bad
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
      - run: cargo publish --dry-run

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen@0.2.130" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build && npm test
        working-directory: bindings/js
      - run: npm pack --dry-run
        working-directory: bindings/js

  wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      # abi3: one wheel per OS and architecture covers every Python >= 3.10.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: bindings/python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: bindings/python/dist

  publish-crates:
    needs: [verify, npm-package, wheels, sdist]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish

  publish-npm:
    needs: [verify, npm-package, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen@0.2.130" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # prepublishOnly builds the WASM and runs the tests before packing.
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        working-directory: bindings/js

  publish-pypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: [verify, npm-package, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
