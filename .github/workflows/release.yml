name: Release

# Push a tag like v0.3.0 to release. Every package is built and checked first;
# publishing only starts once all of them succeed, so a failed build can't leave
# a half-published release (registry uploads can't be undone).
#
# Publishing is opt-in per registry. Without credentials a tag only verifies:
#   crates.io  repository secret    CARGO_REGISTRY_TOKEN
#   npm        repository secret    NPM_TOKEN (granular token, read and write, bypass 2FA)
#   PyPI       repository variable  PUBLISH_PYPI=true, plus a trusted publisher
#              on pypi.org for this repo, workflow release.yml, environment pypi
#              (no secret needed)
# These must be GitHub Actions secrets: a token stored anywhere else is invisible
# here. A registry without its credential is skipped with a warning annotation
# and a note in the run summary, so a green run does not mean everything shipped.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches every manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bad=0
          for f in Cargo.toml bindings/wasm/Cargo.toml bindings/python/Cargo.toml bindings/uniffi/Cargo.toml bindings/python/pyproject.toml bindings/kotlin/build.gradle.kts; do
            v=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            [ "$v" = "$tag" ] || { echo "::error::$f is $v, tag is $tag"; bad=1; }
          done
          v=$(node -p "require('./bindings/js/package.json').version")
          [ "$v" = "$tag" ] || { echo "::error::bindings/js/package.json is $v, tag is $tag"; bad=1; }
          exit $bad
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
      - run: cargo publish --dry-run

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen@0.2.130" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build && npm test
        working-directory: bindings/js
      - run: npm pack --dry-run
        working-directory: bindings/js

  wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      # abi3: one wheel per OS and architecture covers every Python >= 3.10.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: bindings/python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist

  # Install the built wheels and run the Python tests, so a wheel that builds but
  # doesn't import never ships. pip picks the wheel that fits each runner.
  wheel-smoke:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - shell: bash
        run: |
          python -m pip install pytest pytest-asyncio httpx
          python -m pip install letsdecide --no-index --find-links dist
          installed=$(python -c 'import importlib.metadata as m; print(m.version("letsdecide"))')
          [ "$installed" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::wheel is $installed, tag is $GITHUB_REF_NAME"; exit 1; }
          # Run from a copy of the tests, so the installed wheel is imported, not the source tree.
          cp -r bindings/python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function tests

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: bindings/python/dist

  publish-crates:
    needs: [verify, npm-package, wheels, wheel-smoke, sdist]
    runs-on: ubuntu-latest
    env:
      # A flag only: the token itself is set on the one step that needs it, so no
      # third-party action or build script ever sees it.
      HAVE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$HAVE_TOKEN" = "true" ]; then
            # --no-verify: the verify job already compiled the package (cargo publish
            # --dry-run), and compiling here would run build scripts with the token set.
            cargo publish --no-verify
          else
            echo "::warning title=crates.io not published::CARGO_REGISTRY_TOKEN is not a GitHub Actions secret on this repository."
            echo "crates.io: NOT published (no CARGO_REGISTRY_TOKEN secret)" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-npm:
    needs: [verify, npm-package, wheels, wheel-smoke, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      HAVE_TOKEN: ${{ secrets.NPM_TOKEN != '' }} # a flag only; see publish-crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen@0.2.130" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Build with no credential in the environment (the npm-package job tested it).
      - run: npm run build
        working-directory: bindings/js
      - name: Publish to npm
        working-directory: bindings/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$HAVE_TOKEN" = "true" ]; then
            # --ignore-scripts: prepublishOnly would rebuild with the token set.
            npm publish --provenance --access public --ignore-scripts
          else
            echo "::warning title=npm not published::NPM_TOKEN is not a GitHub Actions secret on this repository."
            echo "npm: NOT published (no NPM_TOKEN secret)" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-pypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: [verify, npm-package, wheels, wheel-smoke, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
